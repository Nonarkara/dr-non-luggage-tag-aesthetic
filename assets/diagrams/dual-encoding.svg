<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
<title id="t">Dual encoding — the same label read from two orientations on a conveyor</title>
<desc id="d">A bag on a belt passes two scanners at ninety degrees. The tag prints its barcode twice, offset, because a conveyor is three-dimensional and a bag lands in an unplanned orientation. Human type is the third reader.</desc>
<defs>
  <style>
    .cond{font-family:"Arial Narrow","Helvetica Neue Condensed",Impact,sans-serif;font-weight:700}
    .mono{font-family:ui-monospace,"SF Mono","Courier New",monospace}
    .sans{font-family:Arial,Helvetica,sans-serif}
    .mic{font-size:9px;letter-spacing:.18em;text-transform:uppercase}
  </style>
  <pattern id="b2" width="9" height="1" patternUnits="userSpaceOnUse">
    <rect width="2" height="1" fill="#14120e"/><rect x="4" width="1" height="1" fill="#14120e"/><rect x="6.5" width="1.5" height="1" fill="#14120e"/>
  </pattern>
  <pattern id="belt" width="24" height="12" patternUnits="userSpaceOnUse">
    <rect width="24" height="12" fill="#d8d2c4"/><rect width="1.5" height="12" fill="#b8b1a0"/>
  </pattern>
</defs>

<rect width="1280" height="560" fill="#f2ece0"/>
<text x="56" y="48" class="mono mic" fill="#14120e" opacity=".7">Dual encoding · a conveyor is three-dimensional</text>

<!-- ── the belt ── -->
<rect x="0" y="300" width="1280" height="56" fill="url(#belt)"/>
<line x1="0" y1="300" x2="1280" y2="300" stroke="#14120e" stroke-width="2"/>
<line x1="0" y1="356" x2="1280" y2="356" stroke="#14120e" stroke-width="2"/>
<g fill="#14120e" opacity=".45">
  <path d="M120 366 l14 0 -7 12 Z"/><path d="M420 366 l14 0 -7 12 Z"/>
  <path d="M720 366 l14 0 -7 12 Z"/><path d="M1020 366 l14 0 -7 12 Z"/>
</g>
<text x="56" y="378" class="mono mic" fill="#14120e" opacity=".55">Travel</text>

<!-- ── pictogram: suitcase on the belt, 1960s printed-instruction style ── -->
<g transform="translate(150,196)">
  <rect width="150" height="104" fill="#6a7245" stroke="#14120e" stroke-width="2"/>
  <path d="M52 0 v-20 h46 v20" fill="none" stroke="#14120e" stroke-width="6"/>
  <rect x="0" y="38" width="150" height="10" fill="#14120e" opacity=".25"/>
  <!-- the tag, hanging, first orientation: bars vertical -->
  <g transform="translate(112,54) rotate(6)">
    <rect width="52" height="86" fill="#f2ece0" stroke="#14120e" stroke-width="1.5"/>
    <circle cx="26" cy="10" r="4" fill="none" stroke="#14120e" stroke-width="2"/>
    <text x="8" y="34" class="cond" font-size="20" fill="#14120e">BKK</text>
    <g transform="translate(8,42)"><rect width="36" height="26" fill="url(#b2)"/></g>
    <text x="8" y="80" class="mono" font-size="5" fill="#14120e">0217123456</text>
  </g>
</g>

<!-- scanner A: reads the vertical axis -->
<g transform="translate(225,60)">
  <rect x="-46" y="0" width="92" height="46" fill="#1f3a63" stroke="#14120e" stroke-width="2"/>
  <text x="-34" y="28" class="mono mic" fill="#f2ece0">Scan A</text>
  <path d="M-30 46 L-8 190 L34 190 L14 46 Z" fill="#c2601f" opacity=".22"/>
  <line x1="-8" y1="46" x2="4" y2="190" stroke="#c2601f" stroke-width="1.5" opacity=".8"/>
</g>
<text x="150" y="390" class="mono mic" fill="#14120e">Reads · bars vertical</text>

<!-- ── the same bag, landed differently ── -->
<g transform="translate(700,196)">
  <rect width="150" height="104" fill="#6a7245" stroke="#14120e" stroke-width="2"/>
  <path d="M52 0 v-20 h46 v20" fill="none" stroke="#14120e" stroke-width="6"/>
  <rect x="0" y="38" width="150" height="10" fill="#14120e" opacity=".25"/>
  <!-- the SAME tag, rotated 90°: the first symbol is now edge-on and unreadable -->
  <g transform="translate(150,52) rotate(96)">
    <rect width="52" height="86" fill="#f2ece0" stroke="#14120e" stroke-width="1.5"/>
    <circle cx="26" cy="10" r="4" fill="none" stroke="#14120e" stroke-width="2"/>
    <text x="8" y="34" class="cond" font-size="20" fill="#14120e">BKK</text>
    <g transform="translate(8,42)"><rect width="36" height="26" fill="url(#b2)"/></g>
    <text x="8" y="80" class="mono" font-size="5" fill="#14120e">0217123456</text>
  </g>
</g>

<!-- scanner B: reads the other axis -->
<g transform="translate(795,60)">
  <rect x="-46" y="0" width="92" height="46" fill="#1f3a63" stroke="#14120e" stroke-width="2"/>
  <text x="-34" y="28" class="mono mic" fill="#f2ece0">Scan B</text>
  <path d="M-30 46 L-14 190 L28 190 L14 46 Z" fill="#c2601f" opacity=".22"/>
  <line x1="-8" y1="46" x2="2" y2="190" stroke="#c2601f" stroke-width="1.5" opacity=".8"/>
</g>
<text x="700" y="390" class="mono mic" fill="#14120e">Reads · the second symbol, offset 90°</text>

<!-- ── the rule ── -->
<g transform="translate(940,68)">
  <rect width="284" height="196" fill="#f7f3e8" stroke="#14120e" stroke-width="2"/>
  <rect x="0" y="0" width="284" height="8" fill="#c2601f"/>
  <text x="20" y="42" class="mono mic" fill="#14120e" opacity=".7">The rule</text>
  <text x="20" y="76" class="sans" font-size="15" fill="#14120e">A bag lands in an</text>
  <text x="20" y="98" class="sans" font-size="15" fill="#14120e">orientation nobody chose.</text>
  <text x="20" y="132" class="sans" font-size="15" fill="#14120e">So the key prints twice,</text>
  <text x="20" y="154" class="sans" font-size="15" fill="#14120e">and a human can read it</text>
  <text x="20" y="176" class="sans" font-size="15" fill="#14120e">when neither scan fires.</text>
</g>

<!-- three readers -->
<g transform="translate(940,378)">
  <text class="mono mic" fill="#14120e" opacity=".7">Three readers, one key</text>
  <g transform="translate(0,18)" class="mono" font-size="12" fill="#14120e">
    <text y="20">1 · machine, axis one</text>
    <text y="42">2 · machine, axis two</text>
    <text y="64">3 · human, printed digits</text>
  </g>
</g>

<text x="56" y="502" class="sans" font-size="13" fill="#14120e" opacity=".75">Digital equivalent: a visible id, a copy button, and an export. The new layer never deletes the old</text>
<text x="56" y="522" class="sans" font-size="13" fill="#14120e" opacity=".75">until every reader in the journey can read it — the weakest reader sets the floor.</text>
</svg>
