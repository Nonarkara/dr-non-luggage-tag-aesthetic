<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title">
  <title id="title">PO Completeness gate — every element must earn its place</title>
  <rect width="980" height="520" fill="#F7F6F2"/>
  <text x="40" y="36" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#111111">PO COMPLETENESS GATE · ประตูความครบ</text>
  <text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111">Closed package: if an element is present, it is required. If it is required, its absence breaks the system.</text>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111111" stroke="#111111">
    <rect x="40" y="88" width="200" height="64" fill="#FFFEFA" stroke-width="1.5"/>
    <text x="56" y="116" font-size="13" font-weight="700" stroke="none">ELEMENT ARRIVES</text>
    <text x="56" y="136" font-size="11" stroke="none">type, colour, rule, icon, copy</text>

    <polygon points="240,120 268,120 268,112 292,128 268,144 268,136 240,136" fill="#111111" stroke="none"/>

    <rect x="300" y="88" width="200" height="64" fill="#FFFEFA" stroke-width="1.5"/>
    <text x="316" y="116" font-size="13" font-weight="700" stroke="none">EXPLICIT MEANING?</text>
    <text x="316" y="136" font-size="11" stroke="none">Can you name the domain?</text>

    <polygon points="500,120 528,120 528,112 552,128 528,144 528,136 500,136" fill="#111111" stroke="none"/>

    <rect x="560" y="88" width="200" height="64" fill="#FFFEFA" stroke-width="1.5"/>
    <text x="576" y="116" font-size="13" font-weight="700" stroke="none">NON-REDUNDANT?</text>
    <text x="576" y="136" font-size="11" stroke="none">Does another element already say it?</text>

    <polygon points="760,120 788,120 788,112 812,128 788,144 788,136 760,136" fill="#111111" stroke="none"/>

    <rect x="740" y="188" width="200" height="64" fill="#FFFEFA" stroke-width="2"/>
    <text x="756" y="216" font-size="13" font-weight="700" stroke="none">SIZE + DOMAIN SET?</text>
    <text x="756" y="236" font-size="11" stroke="none">Weight matches scan order.</text>
  </g>

  <!-- fail / pass -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <line x1="400" y1="152" x2="400" y2="220" stroke="#111111" stroke-width="1.5"/>
    <rect x="300" y="220" width="200" height="56" fill="#111111"/>
    <text x="316" y="244" font-size="13" font-weight="700" fill="#FFFEFA">FAIL — REMOVE</text>
    <text x="316" y="262" font-size="11" fill="#FFFEFA">Decorative / filler / slogan</text>

    <line x1="660" y1="152" x2="660" y2="220" stroke="#111111" stroke-width="1.5"/>
    <rect x="560" y="220" width="200" height="56" fill="#111111"/>
    <text x="576" y="244" font-size="13" font-weight="700" fill="#FFFEFA">FAIL — MERGE</text>
    <text x="576" y="262" font-size="11" fill="#FFFEFA">Said twice, keep the stronger</text>

    <line x1="840" y1="252" x2="840" y2="300" stroke="#111111" stroke-width="1.5"/>
    <rect x="740" y="300" width="200" height="56" fill="#111111"/>
    <text x="756" y="324" font-size="13" font-weight="700" fill="#FFFEFA">FAIL — RESIZE</text>
    <text x="756" y="342" font-size="11" fill="#FFFEFA">Wrong weight for the domain</text>

    <rect x="40" y="300" width="460" height="80" fill="#FFFEFA" stroke="#111111" stroke-width="2"/>
    <text x="56" y="332" font-size="16" font-weight="700">PASS — KEEP</text>
    <text x="56" y="356" font-size="12">Present because required. Required because absence would break routing, claim, or audit.</text>
  </g>

  <text x="40" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111111">OPTIONAL IS NOT A CATEGORY</text>
  <text x="40" y="448" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111">RFID, colour, and sustainability marks enter only when the domain is in the package (priority, crew, hazard, reusable, cold-chain).</text>
  <text x="40" y="476" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#111111">Motivational copy, empty badges, and “eco” ornaments fail the gate by default.</text>
</svg>
