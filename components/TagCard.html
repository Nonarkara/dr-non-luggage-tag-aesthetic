<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TagCard</title>
  <link rel="stylesheet" href="tag-system.css"/>
</head>
<body class="tag-body">
  <main class="tag-page">
    <p class="tag-kicker">Component · TagCard</p>
    <p>Closed package. Every child is required. Open this file locally.</p>

    <!--
      TagCard
      size: package (contains all ranks)
      domain: the bag / the object
    -->
    <article class="tag-card" data-domain="default" aria-label="Baggage tag card BKK 0217123456">
      <div class="tag-card-face">
        <!-- size: primary · domain: IATA three-letter destination -->
        <h1 class="tag-dest">BKK<span class="tag-dest-city">Bangkok · จุดหมาย</span></h1>

        <!-- size: tertiary · domain: carrier / flight / date -->
        <ul class="tag-status">
          <li><span class="tag-status-key">Carrier</span>TG</li>
          <li><span class="tag-status-key">Flight</span>676</li>
          <li><span class="tag-status-key">Date</span>08SEP26</li>
          <li><span class="tag-status-key">Route</span>NRT–BKK</li>
        </ul>

        <!-- size: secondary · domain: 10-digit LPN -->
        <div class="tag-id">
          <span class="tag-id-label">License plate</span>
          <img class="tag-barcode" src="../assets/barcode-lpn.svg" alt="Code 128C of 0217123456"/>
          <button class="tag-id-copy" type="button" data-copy="0217123456" data-label="0217123456">0217123456</button>
        </div>

        <!-- size: fallback · domain: passenger name -->
        <p class="tag-fallback">Arkara/Non</p>

        <!-- size: stub · domain: claim / load / transfer backup -->
        <div class="tag-stubs">
          <div class="tag-stub"><strong>Claim / ใบรับ</strong><span class="tag-id">0217123456</span></div>
          <div class="tag-stub"><strong>Stub · Load</strong><span class="tag-id">0217123456</span></div>
          <div class="tag-stub"><strong>Stub · Xfer</strong><span class="tag-id">0217123456</span></div>
        </div>
      </div>
    </article>
  </main>
  <script src="tag-system.js"></script>
</body>
</html>
